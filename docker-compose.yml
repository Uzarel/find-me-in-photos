services:
  face-finder:
    build:
      context: .
      target: runtime
    image: face-finder:latest
    ports:
      # Bound to localhost only: the app is not reachable from the network.
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - "${PHOTOS_DIR:-./photos}:/photos:ro"
      - face-finder-data:/data
    environment:
      MATCH_THRESHOLD: "${MATCH_THRESHOLD:-0.363}"
    # The container can only write to the index cache and a temporary folder.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: face-finder:test
    volumes:
      - "${PHOTOS_DIR:-./photos}:/photos:ro"

volumes:
  face-finder-data:
